baseURL = 'https://ritori2022.github.io/My-Works/'
languageCode = 'zh-cn'
title = '喵喵的创作空间'
theme = 'PaperMod'
[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "个人创作与研究档案 — 小说、学术研究、互动可视化与哲学编程"
  author = "喵喵"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  defaultTheme = "auto"
  disableThemeToggle = false

  [params.homeInfoParams]
    Title = "欢迎来到喵喵的创作空间 👋"
    Content = "这里收录了我的小说创作、学术研究、互动可视化实验和编程项目。在代码与文字之间，探索意识的边界。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Ritori2022"

[menu]
  [[menu.main]]
    identifier = "novels"
    name = "小说"
    url = "/novels/"
    weight = 10
  [[menu.main]]
    identifier = "research"
    name = "研究"
    url = "/research/"
    weight = 20
  [[menu.main]]
    identifier = "projects"
    name = "项目"
    url = "/projects/"
    weight = 30
  [[menu.main]]
