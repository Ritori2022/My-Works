<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水族箱模拟器 v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes swimTail {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(-0.8) translateX(2px); }
        }
        @keyframes swimFin {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg) translate(-2px,0); }
        }
        @keyframes lightRays {
            0% { transform: rotate(45deg) translateY(0); opacity: 0.3; }
            50% { transform: rotate(45deg) translateY(-20px); opacity: 0.5; }
            100% { transform: rotate(45deg) translateY(0); opacity: 0.3; }
        }
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body class="bg-black">
<div id="app" class="w-full h-screen flex flex-col items-center justify-center overflow-hidden font-sans"></div>

<script>
// --- 配置 ---
const TANK_CONFIG = { drag: 0.96, turnSpeed: 0.08, perceptionRadius: 30 };

const SPECIES = [
    { name: 'NeonTetra', color1: '#0052cc', color2: '#ff0000', scale: 0.8, speedBase: 0.7, finColor: 'rgba(200,200,255,0.4)' },
    { name: 'Goldfish', color1: '#ff9900', color2: '#ffcc00', scale: 1.2, speedBase: 0.4, finColor: 'rgba(255,200,100,0.5)' },
    { name: 'Discus', color1: '#20e3b2', color2: '#2980b9', scale: 1.5, speedBase: 0.3, finColor: 'rgba(40,220,180,0.3)' },
    { name: 'Clownfish', color1: '#ff6b35', color2: '#ffffff', scale: 1.0, speedBase: 0.5, finColor: 'rgba(255,107,53,0.6)' }
];

const random = (min, max) => Math.random() * (max - min) + min;
const lerpAngle = (start, end, t) => {
    const da = (end - start) % (2 * Math.PI);
    const dist = (2 * da) % (2 * Math.PI) - da;
    return start + dist * t;
};

// --- State ---
let fishes = [];
let food = [];
let bubbles = [];

function createFish() {
    const species = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    return {
        id: Math.random().toString(36).substr(2, 9),
        x: random(10, 90), y: random(10, 90),
        vx: random(-0.2, 0.2), vy: random(-0.1, 0.1),
        angle: random(0, Math.PI * 2),
        species, depth: random(0.1, 1), phase: random(0, 100),
    };
}

for (let i = 0; i < 8; i++) fishes.push(createFish());

// --- DOM ---
const app = document.getElementById('app');
const tank = document.createElement('div');
tank.className = 'relative w-full max-w-5xl cursor-crosshair overflow-hidden rounded-xl shadow-2xl border-8 border-gray-800';
tank.style.cssText = 'aspect-ratio:16/9;background:#0c1a2a;';
tank.innerHTML = `
    <div class="absolute inset-0 bg-gradient-to-b from-cyan-900/40 via-blue-900/20 to-blue-950/70 z-0"></div>
    <div class="absolute -top-1/2 -left-1/2 w-[200%] h-[200%] pointer-events-none z-[1] opacity-30">
        <div class="w-full h-full blur-xl" style="animation:lightRays 8s ease-in-out infinite;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.1) 45%,transparent 100%);transform:rotate(45deg)"></div>
    </div>
    <div id="bubbleLayer" class="absolute inset-0 z-[2] pointer-events-none"></div>
    <div id="foodLayer" class="absolute inset-0 z-[4] pointer-events-none"></div>
    <div id="fishLayer" class="absolute inset-0 z-[3] pointer-events-none"></div>
    <div class="absolute bottom-0 w-full h-32 bg-gradient-to-t from-black/80 to-transparent z-[5] pointer-events-none"></div>
    <div class="absolute top-6 right-6 z-[6]">
        <div class="bg-black/40 backdrop-blur-md p-3 rounded-lg border border-white/10 text-white shadow-lg">
            <div class="text-xs text-gray-300 mb-2 uppercase tracking-wider font-bold">生态系统控制</div>
            <div class="flex gap-2">
                <button id="addBtn" class="p-2 bg-blue-600/80 hover:bg-blue-500 rounded transition flex items-center justify-center w-10 h-10" title="添加鱼">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button id="removeBtn" class="p-2 bg-red-600/80 hover:bg-red-500 rounded transition flex items-center justify-center w-10 h-10" title="移除鱼">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
            <div id="fishCount" class="mt-2 text-xs text-blue-200">🐟 数量: 8</div>
            <div class="mt-1 text-xs text-yellow-200">💧 点击投放鱼食</div>
        </div>
    </div>
`;
app.appendChild(tank);

const subtitle = document.createElement('div');
subtitle.className = 'mt-4 text-gray-500 text-sm';
subtitle.textContent = 'Simulation v2.0 - Boids Physics & Procedural SVG';
app.appendChild(subtitle);

const fishLayer = document.getElementById('fishLayer');
const foodLayer = document.getElementById('foodLayer');
const bubbleLayer = document.getElementById('bubbleLayer');
const fishCountEl = document.getElementById('fishCount');

document.getElementById('addBtn').addEventListener('click', e => { e.stopPropagation(); fishes.push(createFish()); });
document.getElementById('removeBtn').addEventListener('click', e => { e.stopPropagation(); fishes.pop(); });
tank.addEventListener('click', e => {
    const rect = tank.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    for (let i = 0; i < 3; i++) food.push({ id: Date.now()+i, x: x+random(-2,2), y: y+random(-2,2), vx: random(-0.1,0.1), vy: 0 });
});

// --- Fish SVG ---
function fishSVGHTML(species) {
    return `<svg width="60" height="40" viewBox="0 0 60 40" style="overflow:visible">
        <defs><radialGradient id="g-${species.name}" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="${species.color2}"/><stop offset="100%" stop-color="${species.color1}"/>
        </radialGradient></defs>
        <path d="M10,20 Q0,5 0,10 L0,30 Q0,35 10,20" fill="${species.finColor}" style="animation:swimTail .6s infinite ease-in-out;transform-origin:10px 20px"/>
        <path d="M35,22 L25,32 L35,28 Z" fill="${species.finColor}" opacity=".8" style="animation:swimFin .9s infinite ease-in-out;transform-origin:35px 22px"/>
        <path d="M10,20 Q25,0 50,20 Q25,40 10,20" fill="url(#g-${species.name})" stroke="rgba(255,255,255,0.1)" stroke-width=".5"/>
        <ellipse cx="35" cy="15" rx="10" ry="4" fill="white" opacity=".2" transform="rotate(-10 35 15)"/>
        <circle cx="48" cy="16" r="2.5" fill="white"/><circle cx="48" cy="16" r="1.5" fill="black"/>
    </svg>`;
}

// --- Render ---
function render() {
    let html = '';
    fishes.forEach(fish => {
        const s = fish.species.scale * (0.5 + fish.depth * 0.5);
        const bl = (1 - fish.depth) * 2;
        const br = 0.6 + fish.depth * 0.4;
        html += `<div style="position:absolute;left:${fish.x}%;top:${fish.y}%;z-index:${Math.floor(fish.depth*100)};transform:translate(-50%,-50%) rotate(${fish.angle}rad) scale(${s});filter:blur(${bl}px) brightness(${br});opacity:${0.9+fish.depth*0.1};pointer-events:none;will-change:transform">${fishSVGHTML(fish.species)}</div>`;
    });
    fishLayer.innerHTML = html;

    html = '';
    food.forEach(f => { html += `<div style="position:absolute;left:${f.x}%;top:${f.y}%;width:6px;height:6px;background:#ca8a04;border-radius:50%;transform:translate(-50%,-50%)"></div>`; });
    foodLayer.innerHTML = html;

    html = '';
    bubbles.forEach(b => { html += `<div style="position:absolute;left:${b.x}%;top:${b.y}%;width:${b.size}px;height:${b.size}px;border-radius:50%;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.1);opacity:${b.opacity};box-shadow:inset -2px -2px 4px rgba(255,255,255,0.2)"></div>`; });
    bubbleLayer.innerHTML = html;

    fishCountEl.textContent = `🐟 数量: ${fishes.length}`;
}

// --- Physics ---
function update() {
    food = food.map(f => ({ ...f, y: f.y + 0.2, x: f.x + Math.sin(f.y*0.1)*0.05 })).filter(f => f.y < 105);

    if (Math.random() < 0.03) bubbles.push({ id: Math.random(), x: random(0,100), y: 105, size: random(2,8), speed: random(0.1,0.4), opacity: random(0.3,0.6) });
    bubbles = bubbles.map(b => ({ ...b, y: b.y-b.speed, x: b.x+Math.sin(b.y*0.05+b.id)*0.1 })).filter(b => b.y > -10);

    fishes = fishes.map(fish => {
        let { x, y, vx, vy, angle, species, phase } = fish;
        let ax = 0, ay = 0, chasing = false;
        let closestFood = null, minDist = TANK_CONFIG.perceptionRadius;

        food.forEach(f => { const d = Math.sqrt((f.x-x)**2+(f.y-y)**2); if (d < minDist) { minDist = d; closestFood = f; } });

        if (closestFood) {
            chasing = true;
            const a = Math.atan2(closestFood.y-y, closestFood.x-x);
            ax += Math.cos(a)*0.04; ay += Math.sin(a)*0.04;
            if (minDist < 2) food = food.filter(f => f !== closestFood);
        } else {
            phase += 0.01; ax += Math.cos(phase*0.5)*0.005; ay += Math.sin(phase*0.7)*0.002;
        }

        if (x < 10) ax += 0.005; if (x > 90) ax -= 0.005;
        if (y < 10) ay += 0.005; if (y > 90) ay -= 0.005;

        vx = (vx+ax)*TANK_CONFIG.drag; vy = (vy+ay)*TANK_CONFIG.drag;
        const spd = Math.sqrt(vx*vx+vy*vy);
        const max = chasing ? species.speedBase*2 : species.speedBase;
        if (spd > max) { vx = (vx/spd)*max; vy = (vy/spd)*max; }
        if (spd < 0.05) vx += (Math.random()-0.5)*0.01;

        x += vx; y += vy;
        angle = lerpAngle(angle, Math.atan2(vy, vx), TANK_CONFIG.turnSpeed);
        return { ...fish, x, y, vx, vy, angle, phase };
    });

    render();
    requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
