<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渗流理论 - 二维点渗流可视化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        input[type=range] { -webkit-appearance: none; height: 8px; background: #e5e7eb; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; }
        #probRange::-webkit-slider-thumb { background: #2563eb; }
        #sizeRange::-webkit-slider-thumb { background: #4b5563; }
    </style>
</head>
<body>
<div id="app" class="flex flex-col lg:flex-row min-h-screen bg-gray-50 text-gray-800"></div>

<script>
/**
 * 并查集 (Union-Find)
 */
class UnionFind {
    constructor(size) {
        this.parent = new Int32Array(size);
        this.sz = new Int32Array(size);
        for (let i = 0; i < size; i++) { this.parent[i] = i; this.sz[i] = 1; }
    }
    find(p) {
        let root = p;
        while (root !== this.parent[root]) root = this.parent[root];
        while (p !== root) { const np = this.parent[p]; this.parent[p] = root; p = np; }
        return root;
    }
    union(p, q) {
        const rp = this.find(p), rq = this.find(q);
        if (rp === rq) return;
        if (this.sz[rp] < this.sz[rq]) { this.parent[rp] = rq; this.sz[rq] += this.sz[rp]; }
        else { this.parent[rq] = rp; this.sz[rp] += this.sz[rq]; }
    }
    connected(p, q) { return this.find(p) === this.find(q); }
}

// --- State ---
let gridSize = 50;
let probability = 0.50;
let simData = null;

function simulate() {
    const total = gridSize * gridSize;
    const vTop = total, vBot = total + 1;
    const uf = new UnionFind(total + 2);
    const ufFull = new UnionFind(total + 1);
    const grid = new Uint8Array(total);
    let openCount = 0;

    for (let i = 0; i < total; i++) {
        if (Math.random() < probability) { grid[i] = 1; openCount++; }
    }

    for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
            const idx = row * gridSize + col;
            if (grid[idx] === 0) continue;
            if (row === 0) { uf.union(idx, vTop); ufFull.union(idx, vTop); }
            if (row === gridSize - 1) uf.union(idx, vBot);
            if (col < gridSize - 1 && grid[idx + 1] === 1) { uf.union(idx, idx + 1); ufFull.union(idx, idx + 1); }
            if (row < gridSize - 1) {
                const down = idx + gridSize;
                if (grid[down] === 1) { uf.union(idx, down); ufFull.union(idx, down); }
            }
        }
    }

    simData = { grid, ufFull, doesPercolate: uf.connected(vTop, vBot), openCount, vTop };
    drawGrid();
    updateUI();
}

function drawGrid() {
    const canvas = document.getElementById('canvas');
    if (!canvas || !simData) return;
    const container = document.getElementById('canvasContainer');
    const cw = container ? container.clientWidth : 600;
    const size = Math.max(300, Math.min(cw - 32, 600));
    canvas.width = size; canvas.height = size;
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';

    const ctx = canvas.getContext('2d');
    const cellSize = size / gridSize;
    const { grid, ufFull, vTop } = simData;

    ctx.fillStyle = '#1f2937';
    ctx.fillRect(0, 0, size, size);

    for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
            const idx = row * gridSize + col;
            const x = col * cellSize, y = row * cellSize;
            const w = Math.ceil(cellSize), h = Math.ceil(cellSize);
            if (grid[idx] === 0) ctx.fillStyle = '#111827';
            else ctx.fillStyle = ufFull.connected(idx, vTop) ? '#3b82f6' : '#ffffff';
            ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
        }
    }
}

function updateUI() {
    if (!simData) return;
    const statusEl = document.getElementById('status');
    if (simData.doesPercolate) {
        statusEl.className = 'p-4 rounded-lg border-l-4 shadow-sm bg-blue-50 border-blue-500';
        statusEl.innerHTML = `<div class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-1">系统状态</div>
            <div class="text-xl font-bold flex items-center gap-2 text-blue-700">
                <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span></span>
                系统已渗流
            </div>`;
    } else {
        statusEl.className = 'p-4 rounded-lg border-l-4 shadow-sm bg-gray-100 border-gray-400';
        statusEl.innerHTML = `<div class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-1">系统状态</div>
            <div class="text-xl font-bold flex items-center gap-2 text-gray-600">
                <span class="h-3 w-3 rounded-full bg-gray-400"></span> 系统阻塞
            </div>`;
    }
    document.getElementById('probVal').textContent = probability.toFixed(3);
    document.getElementById('sizeVal').textContent = `${gridSize} x ${gridSize}`;
}

// --- Build UI ---
document.getElementById('app').innerHTML = `
    <div class="w-full lg:w-80 bg-white shadow-xl z-10 flex flex-col flex-none border-r border-gray-200">
        <div class="p-6 border-b border-gray-200 bg-gradient-to-r from-blue-600 to-blue-700 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                渗流理论
            </h1>
            <p class="text-blue-100 text-sm mt-1">二维点渗流可视化</p>
        </div>
        <div class="p-6 space-y-6">
            <div id="status" class="p-4 rounded-lg border-l-4 shadow-sm bg-gray-100 border-gray-400"></div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-medium text-gray-700">开放概率 (p)</label>
                    <span id="probVal" class="text-lg font-mono font-bold text-blue-600">0.500</span>
                </div>
                <input id="probRange" type="range" min="0" max="1" step="0.005" value="0.50" class="w-full cursor-pointer">
                <div class="flex justify-between text-xs text-gray-400 mt-1 font-mono">
                    <span>0%</span><span class="text-red-400 font-bold">Pc ≈ 0.593</span><span>100%</span>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-medium text-gray-700">网格大小 (N)</label>
                    <span id="sizeVal" class="text-sm font-mono bg-gray-100 px-2 py-1 rounded text-gray-600">50 x 50</span>
                </div>
                <input id="sizeRange" type="range" min="10" max="200" step="10" value="50" class="w-full cursor-pointer">
            </div>
            <button id="regenBtn" class="w-full py-3 px-4 bg-gray-900 hover:bg-gray-800 text-white rounded-lg shadow-md transition-all flex items-center justify-center gap-2 font-medium">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                重新生成网格
            </button>
        </div>
    </div>
    <div class="flex-1 bg-gray-100 relative min-h-[500px]">
        <div id="canvasContainer" class="absolute inset-0 p-4 flex flex-col items-center justify-center overflow-auto">
            <div class="relative shadow-2xl border-4 border-white bg-white rounded-sm shrink-0">
                <canvas id="canvas" style="image-rendering:pixelated" class="block touch-none"></canvas>
            </div>
            <div class="mt-6 bg-white py-3 px-6 rounded-full shadow-sm border border-gray-200 flex gap-6 text-sm">
                <div class="flex items-center gap-2"><span class="w-4 h-4 bg-blue-500 rounded-sm shadow-sm"></span><span class="text-gray-700 font-medium">连通水流</span></div>
                <div class="flex items-center gap-2"><span class="w-4 h-4 bg-white border border-gray-300 rounded-sm shadow-sm"></span><span class="text-gray-700 font-medium">开放空隙</span></div>
                <div class="flex items-center gap-2"><span class="w-4 h-4 bg-gray-900 rounded-sm shadow-sm"></span><span class="text-gray-700 font-medium">阻塞岩石</span></div>
            </div>
        </div>
    </div>
`;

// --- Event bindings ---
document.getElementById('probRange').addEventListener('input', e => {
    probability = parseFloat(e.target.value);
    simulate();
});
document.getElementById('sizeRange').addEventListener('input', e => {
    gridSize = parseInt(e.target.value);
    simulate();
});
document.getElementById('regenBtn').addEventListener('click', () => simulate());
window.addEventListener('resize', () => { if (simData) drawGrid(); });

// Initial simulation
simulate();
</script>
</body>
</html>
