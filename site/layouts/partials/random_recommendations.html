{{- /* Random content recommendations.
     Fetches /index.json at runtime and picks 3 random entries to display.
     index.json is generated by PaperMod's home output (HTML, RSS, JSON). */ -}}

<div class="random-recs" id="random-recs" style="display:none">
  <h3 class="random-recs-title">✦ 随机漫游</h3>
  <ul class="random-recs-list" id="random-recs-list"></ul>
</div>

<style>
.random-recs {
  margin: 2.5rem 0 1rem;
  padding: 1.2rem 1.5rem;
  border: 1px solid var(--border, #e5e7eb);
  border-radius: 8px;
  background: var(--entry, transparent);
}
.random-recs-title {
  font-size: 1rem;
  font-weight: 600;
  margin: 0 0 0.8rem;
  color: var(--secondary, #555);
  letter-spacing: 0.04em;
}
.random-recs-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.random-recs-list li a {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  color: var(--primary, #333);
  text-decoration: none;
  font-size: 0.95rem;
  line-height: 1.4;
  transition: color 0.15s;
}
.random-recs-list li a:hover { color: var(--tertiary, #0070f3); }
.random-recs-list .rec-section {
  font-size: 0.75rem;
  color: var(--secondary, #888);
  white-space: nowrap;
  flex-shrink: 0;
}
.random-recs-list .rec-title { flex: 1; }
</style>

<script>
(function () {
  const PICK_N = 3;
  const currentUrl = window.location.pathname;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function sectionLabel(permalink) {
    const m = permalink.match(/\/([^\/]+)\/[^\/]+\/?$/);
    if (!m) return '';
    const map = {
      'thoughts': '思考',
      'theater':  '概念剧场',
      'notes':    '笔记',
      'novels':   '小说',
      'research': '研究',
      'projects': '项目',
      'games':    '互动',
      'philosophy': '哲学程序',
    };
    return map[m[1]] || m[1];
  }

  fetch('{{ site.BaseURL }}index.json')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data || !Array.isArray(data)) return;

      // Filter out current page and pages without a title
      var pool = data.filter(function (p) {
        return p.title && p.permalink && !p.permalink.endsWith(currentUrl);
      });

      if (pool.length === 0) return;

      var picks = shuffle(pool).slice(0, PICK_N);
      var list  = document.getElementById('random-recs-list');
      var wrap  = document.getElementById('random-recs');

      picks.forEach(function (p) {
        var li  = document.createElement('li');
        var a   = document.createElement('a');
        a.href  = p.permalink;

        var section = sectionLabel(p.permalink);
        if (section) {
          var tag = document.createElement('span');
          tag.className   = 'rec-section';
          tag.textContent = '[' + section + ']';
          a.appendChild(tag);
        }

        var title = document.createElement('span');
        title.className   = 'rec-title';
        title.textContent = p.title;
        a.appendChild(title);

        li.appendChild(a);
        list.appendChild(li);
      });

      wrap.style.display = 'block';
    })
    .catch(function () { /* silently ignore fetch errors */ });
})();
</script>
